<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maturko – uređivanje sadržaja</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .panel { background:#fff; border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:20px; }
    .panel h3 { margin-top:0; }
    select { display:block; width:100%; margin-top:4px; padding:10px; border:1px solid var(--line); border-radius:6px; font-size:15px; }
    .row { display:flex; gap:10px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); }
    .row span { flex:1; }
    .del { background:none; border:0; color:#d93025; cursor:pointer; font-size:14px; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">Matur<span>ko</span></a>
    <span style="color:var(--muted)">› Uređivanje sadržaja</span>
    <div class="spacer"></div>
    <a href="app.html">Natrag na učionice</a>
  </header>

  <main class="page" id="gate">
    <div class="checkout">
      <h2>Pristup za administratora</h2>
      <label class="field" style="text-align:left">Šifra<input id="code" type="password"></label>
      <div class="error" id="gateError"></div>
      <button class="btn" style="width:100%" onclick="unlock()">Uđi</button>
    </div>
  </main>

  <main class="page hidden" id="admin">
    <div class="notice">Demo način: promjene se spremaju samo u ovom pregledniku. Da bi ih vidjeli svi učenici, potrebno je povezati bazu podataka.</div>

    <div class="panel">
      <h3>Novi predmet</h3>
      <label class="field">Naziv<input id="cTitle"></label>
      <label class="field">Opis<input id="cDesc"></label>
      <label class="field">Boja<input id="cColor" type="color" value="#1a73e8"></label>
      <button class="btn" onclick="addCourse()">Dodaj predmet</button>
    </div>

    <div class="panel">
      <h3>Predmet koji uređujete</h3>
      <select id="courseSel" onchange="renderCourse()"></select>
    </div>

    <div class="panel">
      <h3>Nova obavijest</h3>
      <label class="field">Tekst<input id="aText"></label>
      <button class="btn" onclick="addAnnouncement()">Objavi</button>
    </div>

    <div class="panel">
      <h3>Novo gradivo</h3>
      <label class="field">Tema (npr. Funkcije)<input id="iTopic"></label>
      <label class="field">Vrsta
        <select id="iType">
          <option value="lesson">Lekcija</option>
          <option value="assignment">Zadatak</option>
          <option value="test">Ispit</option>
          <option value="video">Videozapis</option>
          <option value="file">Datoteka</option>
        </select>
      </label>
      <label class="field">Naslov<input id="iTitle"></label>
      <label class="field">Poveznica (URL)<input id="iLink" placeholder="https://..."></label>
      <button class="btn" onclick="addItem()">Dodaj gradivo</button>
    </div>

    <div class="panel">
      <h3>Trenutni sadržaj</h3>
      <div id="current"></div>
    </div>

    <button class="btn ghost" onclick="if(confirm('Vratiti sav sadržaj na početni?')){Store.reset();load();}">Vrati početni sadržaj</button>
  </main>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script>
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const $ = id => document.getElementById(id);
    let courses = [];

    function unlock() {
      if ($("code").value !== SITE.adminCode) { $("gateError").textContent = "Pogrešna šifra."; return; }
      sessionStorage.setItem("admin", "1");
      show();
    }
    function show() { $("gate").classList.add("hidden"); $("admin").classList.remove("hidden"); load(); }
    if (sessionStorage.getItem("admin")) show();

    function load(keep) {
      courses = Store.courses();
      $("courseSel").innerHTML = courses.map(c => `<option value="${esc(c.id)}">${esc(c.title)}</option>`).join("");
      if (keep) $("courseSel").value = keep;
      renderCourse();
    }
    const cur = () => courses.find(c => c.id === $("courseSel").value);
    const commit = () => { Store.save(courses); load($("courseSel").value); };

    function addCourse() {
      const title = $("cTitle").value.trim();
      if (!title) return;
      courses.push({ id: "c" + Date.now(), title, section: "Priprema za maturu", color: $("cColor").value,
        description: $("cDesc").value.trim(), announcements: [], topics: [] });
      Store.save(courses); load(courses[courses.length - 1].id);
      $("cTitle").value = $("cDesc").value = "";
    }
    function addAnnouncement() {
      const text = $("aText").value.trim();
      if (!text || !cur()) return;
      cur().announcements.unshift({ date: new Date().toISOString().slice(0, 10), text });
      $("aText").value = ""; commit();
    }
    function addItem() {
      const c = cur(), topic = $("iTopic").value.trim(), title = $("iTitle").value.trim();
      if (!c || !topic || !title) return;
      let t = c.topics.find(t => t.name === topic);
      if (!t) c.topics.push(t = { name: topic, items: [] });
      t.items.push({ type: $("iType").value, title, link: $("iLink").value.trim() || "#", date: new Date().toISOString().slice(0, 10) });
      $("iTitle").value = $("iLink").value = ""; commit();
    }
    function delCourse() { if (confirm("Obrisati cijeli predmet?")) { courses = courses.filter(c => c !== cur()); Store.save(courses); load(); } }
    function delAnn(i) { cur().announcements.splice(i, 1); commit(); }
    function delItem(t, i) {
      const topic = cur().topics[t]; topic.items.splice(i, 1);
      if (!topic.items.length) cur().topics.splice(t, 1);
      commit();
    }
    function renderCourse() {
      const c = cur();
      if (!c) { $("current").innerHTML = '<div class="empty">Nema predmeta.</div>'; return; }
      $("current").innerHTML =
        `<button class="del" onclick="delCourse()">Obriši predmet „${esc(c.title)}”</button>
         <h4>Obavijesti</h4>` +
        (c.announcements.map((a, i) => `<div class="row"><span>${esc(a.date)} – ${esc(a.text)}</span><button class="del" onclick="delAnn(${i})">Obriši</button></div>`).join("") || "<div class='meta'>Nema obavijesti.</div>") +
        `<h4>Gradivo</h4>` +
        (c.topics.map((t, ti) => `<strong>${esc(t.name)}</strong>` + t.items.map((it, ii) =>
          `<div class="row"><span>${esc(it.title)}</span><button class="del" onclick="delItem(${ti},${ii})">Obriši</button></div>`).join("")).join("") || "<div class='meta'>Nema gradiva.</div>");
    }
  </script>
</body>
</html>
